<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>
<body>
    
<div style="display: flex; flex-direction: row;">

  <div id="num1" contenteditable="true" style="min-width: 80px; min-height: 38px;"></div>

  <select id="operador" style="width: auto;">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>

  <div id="num2" contenteditable="true" style="min-width: 80px; min-height: 38px;"></div>

  <button id="btnCalcular" class="btn btn-primary">Try me!</button>
</div>

<div id="resultado"></div>

<script>
setInterval(() => {
  alert("Please, use me...");
}, 30000);

$('#btnCalcular').on('click', () => {
  const val1 = $('#num1').text().trim();
  const val2 = $('#num2').text().trim();
  const op = $('#operador').val();
  const $resDiv =$('#resultado');

  const n1 = parseInt(val1, 10);
  const n2 = parseInt(val2, 10);

  if (isNaN(n1) || isNaN(n2) || val1.includes('.') || val1.includes(',') || val2.includes('.') || val2.includes(',')) {
    const msgErro = "Error :(";
    $resDiv.text(msgErro);
    console.error(msgErro);
    return;
  }

  if (op === '/' && n2 === 0) {
    const msgZero = "It's over 9000!";
    $resDiv.text(msgZero);
    console.error(msgZero);
    alert(msgZero);
    return;
  }

  let resultado;
  switch (op) {
    case '+': resultado = n1 + n2; break;
    case '-': resultado = n1 - n2; break;
    case '*': resultado = n1 * n2; break;
    case '/': resultado = n1 / n2; break;
  }

  $resDiv.text(`Resultado: ${resultado}`);
  console.log(`Cálculo: ${n1} ${op} ${n2} = ${resultado}`);
  alert(`Resultado: ${resultado}`);
});
</script>

</body>
</html>
