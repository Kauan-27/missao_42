<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
<div class="d-flex align-items-center gap-2 mb-3" style="display: flex; flex-direction: row;">

  <div id="num1" contenteditable="true" class="border p-2" style="min-width: 80px; min-height: 38px;"></div>

  <select id="operador" class="form-select" style="width: auto;">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>

  <div id="num2" contenteditable="true" class="border p-2" style="min-width: 80px; min-height: 38px;"></div>

  <button id="btnCalcular" class="btn btn-primary">Try me!</button>
</div>

<div id="resultado" class="fw-bold fs-5"></div>

<script>

setInterval(() => {
  alert("’Please, use me...");
}, 30000);

document.getElementById('btnCalcular').addEventListener('click', () => {
  const val1 = document.getElementById('num1').innerText.trim();
  const val2 = document.getElementById('num2').innerText.trim();
  const op = document.getElementById('operador').value;
  const resDiv = document.getElementById('resultado');

  const n1 = parseInt(val1, 10);
  const n2 = parseInt(val2, 10);

  if (isNaN(n1) || isNaN(n2) || val1.includes('.') || val1.includes(',') || val2.includes('.') || val2.includes(',')) {
    const msgErro = "'Error : (Apenas números inteiros são aceitos)'";
    resDiv.innerText = msgErro;
    console.error(msgErro);
    return;
  }

  if (op === '/' && n2 === 0) {
    const msgZero = "It's over 9000!";
    resDiv.innerText = msgZero;
    console.error(msgZero);
    return;
  }

  let resultado;
  switch (op) {
    case '+': resultado = n1 + n2; break;
    case '-': resultado = n1 - n2; break;
    case '*': resultado = n1 * n2; break;
    case '/': resultado = n1 / n2; break;
  }

  resDiv.innerText = `Resultado: ${resultado}`;
  console.log(`Cálculo: ${n1} ${op} ${n2} = ${resultado}`);
});

</script>

</body>
</html>
