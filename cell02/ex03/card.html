<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <link rel="stylesheet" href="card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
    <body>
        
        <div class="container">
        <h2 style="text-align: center; margin: 10px">Cartão de Perfil</h2>

        <table>
            <tr>
                <td><img src="https://i.pinimg.com/736x/e9/60/14/e96014391327a150ba457d170f6abbb4.jpg" alt="User Image"></td>
            </tr>
            <tr>
                <td>
                    <h1>kandrade</h1></td>
            </tr>
            <tr>
                <td><p>Level 999, Hacker</p></td>
            </tr>
            <tr>
                <td><p>42 São Paulo</p></td>
            </tr>
            <tr>
                <td><p>
                    <i class="fa-brands fa-instagram" style="font-size: 24px; color: black;"></i>
                    <i class="fa-brands fa-whatsapp" style="font-size: 24px; color: black;"></i>
                    <i class="fa-brands fa-github" style="font-size: 24px; color: black;"></i>
                    <i class="fa-brands fa-x-twitter" style="font-size: 24px; color: black;"></i>
                </p></td>
            </tr>
            <tr style="background-color: black;">
                <td>
                    <div class="contato">
                        <h3><a href="https://example.com">Contato</a></h3>
                    </div>
                </td>
            </tr>
        </table>
    </div>
    </body>
</html>
